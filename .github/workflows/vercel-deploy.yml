name: Build web and optionally deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (web)
        working-directory: web
        run: npm ci

      - name: Build (web)
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build

      - name: Run Prisma migrations (if DATABASE_URL set)
        if: secrets.DATABASE_URL != ''
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate:deploy

      - name: Deploy to Vercel (optional, if VERCEL_TOKEN set)
        if: secrets.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: web
          prod: true

      - name: Done
        run: echo "Workflow finished. If Vercel is integrated with GitHub this push will also trigger a Vercel deployment."
